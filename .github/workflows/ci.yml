name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - ".github/workflows/ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      # --- Checks ---
      - run: pnpm run type-check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

      # --- E2E ---
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Start Supabase and verify E2E services
        timeout-minutes: 10
        env:
          # Official mirror: avoid ECR's shared anonymous download quota.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          # Keep this in the foreground so pull, migration and health failures fail CI.
          supabase start --exclude realtime,edge-runtime,logflare,vector,studio,imgproxy,supavisor
          supabase status
          for endpoint in auth/v1/health storage/v1/status; do
            echo "Waiting for $endpoint..."
            curl --fail --silent --show-error \
              --retry 29 --retry-all-errors --retry-delay 2 \
              --connect-timeout 2 --max-time 5 --retry-max-time 90 \
              "http://localhost:54321/$endpoint"
          done

      - run: pnpm exec tsx tests/e2e/seed.ts
      - run: pnpm exec playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
